info:
  name: Delete Account (second user)
  type: http
  seq: 5
  tags:
  - Teardown
http:
  method: DELETE
  url: '{{baseUrl}}/api/auth/delete-account'
  headers:
  - name: Cookie
    value: Lune_auth={{token}}
  auth: inherit
runtime:
  scripts:
  - type: after-response
    code: |-
      bru.setVar('token', '');
  - type: tests
    code: |-
      test('returns 204', () => {
        expect(res.status).to.equal(204);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
