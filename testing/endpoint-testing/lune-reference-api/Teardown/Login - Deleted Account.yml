info:
  name: Login - Deleted Account
  type: http
  seq: 3
  tags:
  - Teardown
http:
  method: POST
  url: '{{baseUrl}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{runEmail}}",
        "password": "{{password}}"
      }
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test('returns 401', () => {
        expect(res.status).to.equal(401);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
