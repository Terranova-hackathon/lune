info:
  name: Add Favorite - Unknown Game
  type: http
  seq: 14
  tags:
  - Favorites
http:
  method: PUT
  url: '{{baseUrl}}/api/favorites/:Id'
  params:
  - name: Id
    value: '{{unknownGameId}}'
    type: path
  headers:
  - name: Cookie
    value: Lune_auth={{token}}
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test('returns 404', () => {
        expect(res.status).to.equal(404);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
