info:
  name: Sign Out (setup)
  type: http
  seq: 1
  tags:
  - Favorites
http:
  method: POST
  url: '{{baseUrl}}/api/auth/logout'
  auth: inherit
runtime:
  scripts:
  - type: after-response
    code: |-
      bru.setVar('token', '');
  - type: tests
    code: |-
      test('returns 204', () => {
        expect(res.status).to.equal(204);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
