info:
  name: List Favorites - Paged
  type: http
  seq: 13
  tags:
  - Favorites
http:
  method: GET
  url: '{{baseUrl}}/api/favorites'
  params:
  - name: page
    value: '2'
    type: query
  - name: pageSize
    value: '1'
    type: query
  headers:
  - name: Cookie
    value: Lune_auth={{token}}
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test('returns 200', () => {
        expect(res.status).to.equal(200);
      });

      test('returns a paged result', () => {
        const b = res.body;
        expect(b).to.have.property('items').that.is.an('array');
        ['page', 'pageSize', 'totalCount', 'totalPages'].forEach(k => expect(b[k], k).to.be.a('number'));
        expect(b.items.length).to.be.at.most(b.pageSize);
        expect(b.totalPages).to.equal(b.pageSize > 0 ? Math.ceil(b.totalCount / b.pageSize) : 0);
      });

      test('second page of one holds the older game', () => {
        expect(res.body.page).to.equal(2);
        expect(res.body.items.length).to.equal(1);
        expect(res.body.totalPages).to.equal(2);
        expect(res.body.items[0].id).to.equal(Number(bru.getEnvVar('gameId')));
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
