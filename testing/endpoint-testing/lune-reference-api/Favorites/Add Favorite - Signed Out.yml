info:
  name: Add Favorite - Signed Out
  type: http
  seq: 4
  tags:
  - Favorites
http:
  method: PUT
  url: '{{baseUrl}}/api/favorites/:Id'
  params:
  - name: Id
    value: '{{gameId}}'
    type: path
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test('returns 401', () => {
        expect(res.status).to.equal(401);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
