- name: 409 Response
  description: Conflict
  request:
    url: '{{baseUrl}}/api/favorites/:Id'
    method: PUT
    params:
    - name: Id
      value: ''
      type: path
      description: Game Database game ID to save, the same ID used by /api/games.
  response:
    status: 409
    statusText: Conflict
    headers:
    - name: Content-Type
      value: application/problem+json
    body:
      type: json
      data: |-
        {
          "type": "",
