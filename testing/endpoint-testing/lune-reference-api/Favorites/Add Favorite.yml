info:
  name: Add Favorite
  type: http
  seq: 8
  tags:
  - Favorites
http:
  method: PUT
  url: '{{baseUrl}}/api/favorites/:Id'
  params:
  - name: Id
    value: '{{gameId}}'
    type: path
  auth: inherit
  headers:
  - name: Cookie
    value: Lune_auth={{token}}
runtime:
  scripts:
  - type: tests
    code: |-
      test('returns 201', () => {
        expect(res.status).to.equal(201);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
examples:
- name: 201 Response
  description: Created
  request:
    url: '{{baseUrl}}/api/favorites/:Id'
    method: PUT
    params:
    - name: Id
      value: ''
      type: path
      description: Game Database game ID to save, the same ID used by /api/games.
  response:
    status: 201
    statusText: Created
    body:
      type: text
      data: ''
- name: 401 Response
  description: Unauthorized
  request:
    url: '{{baseUrl}}/api/favorites/:Id'
    method: PUT
    params:
    - name: Id
      value: ''
