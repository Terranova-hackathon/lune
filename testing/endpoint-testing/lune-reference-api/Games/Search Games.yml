docs: Search the game catalog by name, filters, or both. With no search term, the most-rated games are listed first; with a search term, results are sorted by name. `ordering` overrides either default. Within one filter, values are OR-ed (any listed genre matches); different filters are AND-ed. Games without a release date or rating are never included.
