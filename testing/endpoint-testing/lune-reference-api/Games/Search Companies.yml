docs: Find developers or publishers by name, for example to fill a filter autocomplete. Matches anywhere in the name, case-insensitive. Returns up to 10 companies, those with the most games first. Pass a result's `slug` to the `developers` or `publishers` parameter of `GET /api/games`.
