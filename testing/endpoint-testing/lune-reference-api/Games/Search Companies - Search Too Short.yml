info:
  name: Search Companies - Search Too Short
  type: http
  seq: 15
  tags:
  - Games
http:
  method: GET
  url: '{{baseUrl}}/api/games/companies?kind=publisher&search=e'
  params:
  - name: kind
    value: publisher
    type: query
  - name: search
    value: e
    type: query
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      function hasErrorKey(body, name) {
        const keys = Object.keys((body && body.errors) || {});
        return keys.some(k => k.toLowerCase() === name.toLowerCase());
      }

      test('returns 400', () => {
        expect(res.status).to.equal(400);
      });

      test('reports an error for search', () => {
        expect(hasErrorKey(res.body, 'search'), JSON.stringify(res.body.errors)).to.equal(true);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
