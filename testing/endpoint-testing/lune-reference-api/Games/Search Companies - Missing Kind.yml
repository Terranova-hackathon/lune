info:
  name: Search Companies - Missing Kind
  type: http
  seq: 13
  tags:
  - Games
http:
  method: GET
  url: '{{baseUrl}}/api/games/companies?search={{developer}}'
  params:
  - name: kind
    value: ''
    type: query
    disabled: true
  - name: search
    value: '{{developer}}'
    type: query
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      function hasErrorKey(body, name) {
        const keys = Object.keys((body && body.errors) || {});
        return keys.some(k => k.toLowerCase() === name.toLowerCase());
      }

      test('returns 400', () => {
        expect(res.status).to.equal(400);
      });

      test('reports an error for kind', () => {
        expect(hasErrorKey(res.body, 'kind'), JSON.stringify(res.body.errors)).to.equal(true);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
