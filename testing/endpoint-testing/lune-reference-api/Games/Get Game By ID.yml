docs: 'Full details for one game: summary, storyline, genres, platforms, developers, publishers, store links, and media as ready-to-use URLs (cover, 1080p screenshots and artwork, YouTube videos). `backgroundImage` is a randomly chosen screenshot, so it can differ between calls. Also includes a paged list of similar games in `relatedGames`; `page` and `pageSize` page through that list only.'
