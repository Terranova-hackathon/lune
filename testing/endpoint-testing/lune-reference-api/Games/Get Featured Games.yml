info:
  name: Get Featured Games
  type: http
  seq: 19
  tags:
  - Games
http:
  method: GET
  url: '{{baseUrl}}/api/games/featured'
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test('returns 200', () => {
        expect(res.status).to.equal(200);
      });

      test('returns up to 10 games', () => {
        expect(res.body).to.be.an('array').that.is.not.empty;
        expect(res.body.length).to.be.at.most(10);
      });

      test('relatedGames is always empty', () => {
        res.body.forEach(g => expect(g.relatedGames.items, g.name).to.be.an('array').that.is.empty);
      });

      test('no duplicate games', () => {
        const ids = res.body.map(g => g.id);
        expect(new Set(ids).size).to.equal(ids.length);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
