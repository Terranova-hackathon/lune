docs: 10 games picked at random from the 50 most-rated on Game Database, for the home page.The selection changes on every call. Each item has the same shape as `GET /api/games/{id}`, but `relatedGames` is always empty and `backgroundImage` is the game's first 1080p screenshot (or its cover).
