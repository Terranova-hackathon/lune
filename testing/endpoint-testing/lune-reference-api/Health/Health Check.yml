info:
  name: Health Check
  type: http
  seq: 1
  tags:
  - Health
http:
  method: GET
  url: '{{baseUrl}}/health'
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test('returns 200', () => {
        expect(res.status).to.equal(200);
      });

      test('body is "ok"', () => {
        expect(String(res.body).trim()).to.equal('ok');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
examples:
- name: 200 Response
  description: OK
  request:
    url: '{{baseUrl}}/health'
    method: GET
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: text/plain
    body:
      type: text
      data: ''
docs: Liveness check for monitoring and Docker. Returns the plain-text string `ok` when the API process is running. It does not check the database or external providers.
