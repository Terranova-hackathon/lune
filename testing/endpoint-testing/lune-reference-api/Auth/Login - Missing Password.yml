info:
  name: Login - Missing Password
  type: http
  seq: 20
  tags:
  - Auth
http:
  method: POST
  url: '{{baseUrl}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{runEmail}}"
      }
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      function hasErrorKey(body, name) {
        const keys = Object.keys((body && body.errors) || {});
        return keys.some(k => k.toLowerCase() === name.toLowerCase());
      }

      test('returns 400', () => {
        expect(res.status).to.equal(400);
      });

      test('reports an error for Password', () => {
        expect(hasErrorKey(res.body, 'Password'), JSON.stringify(res.body.errors)).to.equal(true);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
