info:
  name: Logout
  type: http
  seq: 28
  tags:
  - Auth
http:
  method: POST
  url: '{{baseUrl}}/api/auth/logout'
  auth: inherit
  headers:
  - name: Cookie
    value: Lune_auth={{token}}
runtime:
  scripts:
  - type: after-response
    code: |-
      bru.setVar('token', '');
  - type: tests
    code: |-
      test('returns 204', () => {
        expect(res.status).to.equal(204);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
examples:
- name: 204 Response
  description: No Content
  request:
    url: '{{baseUrl}}/api/auth/logout'
    method: POST
  response:
    status: 204
    statusText: No Content
    body:
      type: text
      data: ''
docs: Sign out by clearing the auth cookie. Always returns 204, even if no one is signed in.
