info:
  name: Login - Wrong Password
  type: http
  seq: 18
  tags:
  - Auth
http:
  method: POST
  url: '{{baseUrl}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{runEmail}}",
        "password": "Wrong-Password1!"
      }
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test('returns 401', () => {
        expect(res.status).to.equal(401);
      });

      test('says the email or password is invalid', () => {
        expect(res.body.title).to.equal('Invalid email or password.');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
