info:
  name: Login
  type: http
  seq: 21
  tags:
  - Auth
http:
  method: POST
  url: '{{baseUrl}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{runEmail}}",
        "password": "{{password}}"
      }
  auth: inherit
runtime:
  scripts:
  - type: after-response
    code: |-
      // Keep the auth cookie so later requests can send it explicitly.
      const raw = res.headers['set-cookie'];
      const cookies = Array.isArray(raw) ? raw : raw ? [raw] : [];
      const auth = cookies.find(c => c.startsWith('Lune_auth='));
      if (auth) bru.setVar('token', auth.split(';')[0].substring('Lune_auth='.length));
  - type: tests
    code: |-
      test('returns 200', () => {
        expect(res.status).to.equal(200);
      });

      test('returns the user shape', () => {
        expect(res.body.id).to.be.a('string').and.not.be.empty;
        expect(res.body).to.have.property('email');
        expect(res.body).to.have.property('displayName');
      });

      test('signs in the first test user', () => {
        expect(res.body.email).to.equal(bru.getVar('runEmail'));
      });

      test('sets the auth cookie', () => {
        expect(bru.getVar('token'), 'Lune_auth cookie').to.be.a('string').and.not.be.empty;
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
examples:
- name: 200 Response
  description: OK
  request:
    url: '{{baseUrl}}/api/auth/login'
    method: POST
    body:
      type: json
      data: |-
        {
          "email": "",
          "password": ""
        }
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "",
          "email": "",
          "displayName": ""
        }
- name: 400 Response
  description: Bad Request
  request:
    url: '{{baseUrl}}/api/auth/login'
    method: POST
    body:
      type: json
      data: |-
        {
          "email": "",
          "password": ""
        }
  response:
    status: 400
    statusText: Bad Request
    headers:
    - name: Content-Type
      value: application/problem+json
    body:
      type: json
      data: |-
        {
          "type": "",
          "title": "",
          "status": "",
          "detail": "",
          "instance": "",
          "errors": {}
        }
- name: 401 Response
  description: Unauthorized
  request:
    url: '{{baseUrl}}/api/auth/login'
    method: POST
    body:
      type: json
      data: |-
        {
          "email": "",
          "password": ""
        }
  response:
    status: 401
    statusText: Unauthorized
    headers:
    - name: Content-Type
      value: application/problem+json
    body:
      type: json
      data: |-
        {
          "type": "",
          "title": "",
          "status": "",
          "detail": "",
          "instance": ""
        }
docs: Sign in with email and password. On success the server sets the HttpOnly auth cookie (valid for 24 hours) and returns the user. A wrong password and an unknown email both return the same 401, so the response does not reveal whether an account exists.
