info:
  name: Login - Unknown Email
  type: http
  seq: 19
  tags:
  - Auth
http:
  method: POST
  url: '{{baseUrl}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "nobody.{{runEmail}}",
        "password": "{{password}}"
      }
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test('returns 401', () => {
        expect(res.status).to.equal(401);
      });

      test('gives the same answer as a wrong password', () => {
        expect(res.body.title).to.equal('Invalid email or password.');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
