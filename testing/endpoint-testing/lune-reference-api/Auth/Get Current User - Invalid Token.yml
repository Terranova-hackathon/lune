info:
  name: Get Current User - Invalid Token
  type: http
  seq: 3
  tags:
  - Auth
http:
  method: GET
  url: '{{baseUrl}}/api/auth/me'
  auth: inherit
  headers:
  - name: Cookie
    value: Lune_auth=not-a-real-token
runtime:
  scripts:
  - type: tests
    code: |-
      test('returns 401', () => {
        expect(res.status).to.equal(401);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
