opencollection: 1.0.0

info:
  name: Lune  Manual API Testing
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"

docs:
  content: |-
    # Lune Game API Endpoints Manually Configured Tests

    These are manually built endpoints that the developer can add to and modify directly. For document-generated endpoints, see the collection `Lune Reference API`

    For full request and response details, run the backend and open the API reference at [`/docs`](http://localhost:3001/docs) (development only). The OpenAPI document is at `/openapi/v1.json`, and a copy is kept in [`openapi.json`](openapi.json).

    ## Authentication

    Sign-in uses a JWT stored in an HttpOnly cookie (`Lune_auth`), not an `Authorization` header. `register` and `login` set the cookie, and it is sent automatically on later requests. Sessions last 24 hours. Protected endpoints return `401 Unauthorized` without a valid cookie.

    In Bruno, run **Register** or **Login** first so the cookie is stored for the protected requests.

    ## General Endpoints

    Any site visitor can use the game search, game data and price endpoints, and can create an account to access the protected endpoints.

    | Type | Route | Description |
    |---|---|---|
    | POST | /api/auth/register | Create a new account and sign in |
    | POST | /api/auth/login | Sign in to an account |
    | POST | /api/auth/logout | Sign out by clearing the auth cookie (always succeeds, even when not signed in) |
    | GET | /api/games/ | Retrieve a paged game list, with or without search and filter query parameters |
    | GET | /api/games/{id:int} | Retrieve full data for one game, including related games |
    | GET | /api/games/featured | Retrieve 10 random games from the most-rated, for the home page |
    | GET | /api/games/filters | Retrieve the genre, platform and sort options the search accepts |
    | GET | /api/games/companies | Search developers or publishers by name (`kind` and `search` query parameters required) |
    | GET | /api/prices/{id:int} | Retrieve Steam and GG.deals prices for one game (Italian region) |
    | GET | /health | Liveness check: returns `ok` when the API process is running |

    ## Protected Endpoints

    Some functionality is reserved for registered users: saving games to a favorites list and managing the user's account.

    | Type | Route | Description |
    |---|---|---|
    | GET | /api/auth/me | Return the signed-in user's data |
    | PUT | /api/auth/profile | Change the signed-in user's display name |
    | DELETE | /api/auth/delete-account | Permanently delete the signed-in user's account and all their data |
    | GET | /api/favorites/ | Return a paged list of game summaries in the user's favorites, newest first |
    | GET | /api/favorites/ids | Return the IDs of all the user's favorites |
    | PUT | /api/favorites/{id:int} | Add a game to the user's favorites by ID |
    | DELETE | /api/favorites/{id:int} | Remove a game from the user's favorites by ID |
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: "{{baseUrl}}"
