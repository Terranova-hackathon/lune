info:
  name: Get Game By ID
  type: http
  seq: 2
  tags:
    - Games

http:
  method: GET
  url: "{{baseUrl}}/api/games/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Game Database game ID. The same ID works with /api/favorites and /api/prices.
    - name: page
      value: "1"
      type: query
      description: Page of related games, starting at 1.
    - name: pageSize
      value: "6"
      type: query
      description: Related games per page, 1–40. Default 6.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/games/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Game Database game ID. The same ID works with /api/favorites and /api/prices.
        - name: page
          value: "1"
          type: query
          description: Page of related games, starting at 1.
        - name: pageSize
          value: "6"
          type: query
          description: Related games per page, 1–40. Default 6.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "released": "",
            "backgroundImage": "",
            "cover": "",
            "rating": "",
            "metacritic": "",
            "description": "",
            "storyLine": "",
            "website": "",
            "externalGames": [
              {
                "source": "",
                "uid": "",
                "url": ""
              }
            ],
            "genres": [
              {
                "value": "",
                "name": ""
              }
            ],
            "platforms": [
              {
                "value": "",
                "name": ""
              }
            ],
            "developers": [
              {
                "value": "",
                "name": ""
              }
            ],
            "publishers": [
              {
                "value": "",
                "name": ""
              }
            ],
            "screenshots": [],
            "artworks": [],
            "videos": [],
            "relatedGames": {
              "items": [
                {
                  "id": "",
                  "name": "",
                  "released": "",
                  "backgroundImage": "",
                  "rating": "",
                  "metacritic": "",
                  "genres": [
                    {
                      "value": "",
                      "name": ""
                    }
                  ],
                  "platforms": [
                    {
                      "value": "",
                      "name": ""
                    }
                  ]
                }
              ],
              "page": "",
              "pageSize": "",
              "totalCount": "",
              "totalPages": ""
            }
