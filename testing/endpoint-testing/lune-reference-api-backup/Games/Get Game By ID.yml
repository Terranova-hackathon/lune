  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/api/games/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Game Database game ID. The same ID works with /api/favorites and /api/prices.
        - name: page
          value: "1"
          type: query
          description: Page of related games, starting at 1.
        - name: pageSize
          value: "6"
          type: query
          description: Related games per page, 1–40. Default 6.
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
  - name: 503 Response
    description: Service Unavailable
    request:
      url: "{{baseUrl}}/api/games/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Game Database game ID. The same ID works with /api/favorites and /api/prices.
        - name: page
          value: "1"
          type: query
          description: Page of related games, starting at 1.
        - name: pageSize
          value: "6"
          type: query
          description: Related games per page, 1–40. Default 6.
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": "",
            "detail": "",
            "instance": ""
          }

docs: "Full details for one game: summary, storyline, genres, platforms, developers, publishers, store links, and media as ready-to-use URLs (cover, 1080p screenshots and artwork, YouTube videos). `backgroundImage` is a randomly chosen screenshot, so it can differ between calls. Also includes a paged list of similar games in `relatedGames`; `page` and `pageSize` page through that list only."
