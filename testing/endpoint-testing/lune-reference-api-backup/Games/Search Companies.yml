info:
  name: Search Companies
  type: http
  seq: 4
  tags:
    - Games

http:
  method: GET
  url: "{{baseUrl}}/api/games/companies"
  params:
    - name: kind
      value: ""
      type: query
      description: Required. `developer` or `publisher`.
      disabled: true
    - name: search
      value: ""
      type: query
      description: "Required. Part of the company name, 2–60 characters. Example: `ubi`."
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

