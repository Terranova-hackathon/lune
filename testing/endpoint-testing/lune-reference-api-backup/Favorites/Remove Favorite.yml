info:
  name: Remove Favorite
  type: http
  seq: 4
  tags:
    - Favorites

http:
  method: DELETE
  url: "{{baseUrl}}/api/favorites/:Id"
  params:
    - name: Id
      value: ""
      type: path
      description: Game Database ID to remove.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{baseUrl}}/api/favorites/:Id"
      method: DELETE
      params:
        - name: Id
          value: ""
          type: path
          description: Game Database ID to remove.
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/favorites/:Id"
      method: DELETE
      params:
        - name: Id
          value: ""
          type: path
          description: Game Database ID to remove.
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""

docs: "Remove a game from the signed-in user's favorites. Safe to repeat: returns 204 whether or not the game was saved. Requires sign-in."
