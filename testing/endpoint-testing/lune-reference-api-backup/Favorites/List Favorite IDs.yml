info:
  name: List Favorite IDs
  type: http
  seq: 2
  tags:
    - Favorites

http:
  method: GET
  url: "{{baseUrl}}/api/favorites/ids"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/favorites/ids"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "[]"
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/favorites/ids"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""

docs: The Game Database IDs of all the signed-in user's saved games, as one unpaged array in no particular order. Use it to mark favorites in search results (for example a filled heart) without loading full game data. Requires sign-in.
