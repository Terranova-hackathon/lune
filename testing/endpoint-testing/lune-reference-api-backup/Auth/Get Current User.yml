info:
  name: Get Current User
  type: http
  seq: 4
  tags:
    - Auth

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/auth/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "email": "",
            "displayName": ""
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/auth/me"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""

docs: Return the signed-in user. Use it to check whether the auth cookie is still valid, for example on page load. `displayName` is null if the user never set one. Returns 401 if not signed in, the session has expired, or the account no longer exists. Requires sign-in.
