<dialog #dialog class="login-prompt">
  <p>You need to log in to add games to your favorites. Proceed?</p>

  <form method="dialog" class="d-flex justify-content-end gap-2">
    <button type="submit" class="btn btn-outline-secondary">
      No
    </button>

    <button type="button" class="btn btn-primary" (click)="confirm()">
      Yes
    </button>
  </form>
</dialog>
