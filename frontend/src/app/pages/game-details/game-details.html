<main class="game-details"
		(pointerdown)="onBackdropPointerDown($event)"
		(click)="onBackdropClick($event)"
	>
	<div class="game-details__container">
		<a class="game-details__back" [routerLink]="gamesNavigation.gamesUrl()">← Back to games</a>

		@if (loading()) {
			<div class="text-center py-5" role="status">
				<div class="spinner-border text-primary"></div>
				<p class="mt-3">Loading game…</p>
			</div>
		} @else if (error()) {
			<div class="alert alert-danger" role="alert">
				<p>{{ error() }}</p>
				<button type="button" class="btn btn-outline-danger" (click)="retry()">
					Try again
				</button>
	</div>
		} @else if (game(); as g) {
			<app-game-hero [game]="g" />

			<article class="game-details__content">
				<app-game-heading
				[game]="g"
				[isFavorite]="favoriteIds().has(g.id)"
				[favoriteBusy]="
					(isLoggedIn() && !favoritesReady()) ||
					favoriteBusyIds().has(g.id)
				"
				[favoriteError]="favoriteError()"
				(favoriteToggled)="toggleFavorite($event)"
				/>
				<section>
					<h2>About</h2>
					<p class="game-details__description">{{ g.description || 'No description available.' }}</p>
					@if (g.storyLine) {
						<h3>Story</h3>
						<p>{{ g.storyLine }}</p>
					}
				</section>

				@if (g.screenshots.length) {
				<app-game-gallery
					[screenshots]="g.screenshots"
					[gameName]="g.name"
				/>
				}
				<app-game-facts [game]="g" />

				<app-game-ratings [game]="g" />

				<app-related-games
				  [relatedGames]="relatedGames()"
				  [relatedLoading]="relatedLoading()"
				  [relatedError]="relatedError()"
				  (pageChanged)="changeRelatedPage($event)"
				/>

			</article>
		}
	</div>
</main>

<app-scroll-controls />
