services:
    # SQL Server
    sqlserver:
        # Pinned: a newer SQL Server can upgrade the data files, and an older one can't open them again.
        # Update on purpose: check the tag's version (16.0.4305.5 = 2022 CU27 GDR), never go lower.
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        environment:
            - ACCEPT_EULA=Y
            - MSSQL_SA_PASSWORD=${SA_PASSWORD}
        # TODO: Need to remove port forwarding before production
        ports:
            - '1433:1433'
        volumes:
            - sqlserver-data:/var/opt/mssql
        networks:
            - private-network
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s
        restart: unless-stopped

    # ASP.NET Core Web API (real backend only: docker compose --profile real up)
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - '3001:3001'
        environment:
            - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
            - ConnectionStrings__Default=Server=sqlserver,1433;Database=Lune;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
            - Jwt__Secret=${JWT_SECRET}
            # - Rawg__ApiKey=${RAWG_API_KEY} # Degraded Service, remove for now
            - Igdb__ClientId=${IGDB_CLIENT_ID}
            - Igdb__ApiSecret=${IGDB_API_SECRET}
            - GgDeals__ApiKey=${GGDEALS_API_KEY}
        volumes:
            - ./backend:/app
            - nuget-cache:/root/.nuget/packages
            - /app/src/Lune.Api/bin
            - /app/src/Lune.Api/obj
            - /app/src/Lune.Auth/bin
            - /app/src/Lune.Auth/obj
            - /app/src/Lune.Games/bin
            - /app/src/Lune.Games/obj
            - /app/src/Lune.Favorites/bin
            - /app/src/Lune.Favorites/obj
            - /app/src/Lune.Prices/bin
            - /app/src/Lune.Prices/obj
            - /app/src/Lune.Shared/bin
            - /app/src/Lune.Shared/obj
        networks:
            - private-network
        healthcheck:
            test: ['CMD-SHELL', 'curl -fs http://localhost:3001/health || exit 1']
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 30s
        depends_on:
            sqlserver:
                condition: service_healthy
        restart: unless-stopped

    # Angular frontend. /api is proxied to API_URL (the mock by default).
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - '8080:8080'
        environment:
            - API_URL=${API_URL:-http://backend:3001}
        volumes:
            - ./frontend:/app
            - /app/node_modules
        networks:
            - private-network
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped

networks:
    private-network:
        driver: bridge

volumes:
    sqlserver-data:
    nuget-cache:
